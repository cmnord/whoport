name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y scdoc shellcheck mandoc

      - name: Lint shell scripts
        run: shellcheck whoport tools/man-preview .githooks/pre-commit

      - name: whoport --help exits 0
        run: ./whoport --help >/dev/null

      - name: whoport with no arguments exits 1
        run: |
          if ./whoport >/dev/null 2>&1; then
            echo "expected a non-zero exit with no arguments" >&2
            exit 1
          fi

      # The committed whoport.1 is generated from whoport.1.scd by the
      # pre-commit hook.  Git does not clone hooks and --no-verify skips them,
      # so this is the only check that catches a stale page.
      #
      # Rendered pages are compared rather than roff source, because scdoc's
      # output spelling varies by version -- 1.11.2 (Ubuntu) emits .P and bare
      # hyphens where 1.11.5 emits .PP and \- -- while the rendered result is
      # identical.  The footer date is dropped too: scdoc derives it from the
      # source file's mtime, which is checkout time on a runner.
      - name: Man page is up to date with its source
        run: |
          scdoc <whoport.1.scd >/tmp/rebuilt.1
          render() {
            mandoc -T ascii "$1" | col -b | grep -v '[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}'
          }
          if ! diff -u <(render whoport.1) <(render /tmp/rebuilt.1); then
            echo >&2
            echo "whoport.1 is stale -- run 'make' and commit the result." >&2
            exit 1
          fi
        shell: bash
