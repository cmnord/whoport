name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y scdoc shellcheck

      - name: Lint shell scripts
        run: shellcheck whoport tools/man-preview .githooks/pre-commit

      - name: whoport --help exits 0
        run: ./whoport --help >/dev/null

      - name: whoport with no arguments exits 1
        run: |
          if ./whoport >/dev/null 2>&1; then
            echo "expected a non-zero exit with no arguments" >&2
            exit 1
          fi

      # The committed whoport.1 is generated from whoport.1.scd by the
      # pre-commit hook.  Git does not clone hooks and --no-verify skips them,
      # so this is the only check that catches a stale page.
      #
      # Two lines are excluded from the comparison because neither reflects the
      # page's content: the .TH date (scdoc derives it from the source file's
      # mtime, which is checkout time on a runner) and the generator comment
      # (the runner's scdoc version differs from a developer's).
      - name: Man page is up to date with its source
        run: |
          scdoc <whoport.1.scd >/tmp/rebuilt.1
          strip() { grep -v -e '^\.\\" Generated by scdoc' -e '^\.TH ' "$1"; }
          if ! diff -u <(strip whoport.1) <(strip /tmp/rebuilt.1); then
            echo >&2
            echo "whoport.1 is stale -- run 'make' and commit the result." >&2
            exit 1
          fi
        shell: bash
